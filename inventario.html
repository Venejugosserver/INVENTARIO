<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>INVENTARIO · Venejugos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --azul:#0B2A8A;        /* azul Venejugos profundo */
  --azul-med:#1740C4;
  --azul-claro:#E8EDFB;
  --rojo:#E5142B;
  --rojo-oscuro:#B00C1F;
  --blanco:#FFFFFF;
  --papel:#F4F6FC;
  --tinta:#10193A;
  --gris:#66708F;
  --linea:#D8DFF2;
  --verde:#128C5A;
  --ambar:#E08A00;
  --sombra:0 1px 2px rgba(11,42,138,.10), 0 8px 24px rgba(11,42,138,.07);
  --radio:14px;
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:'Manrope',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:var(--papel); color:var(--tinta);
  font-variant-numeric:tabular-nums; -webkit-font-smoothing:antialiased;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}

/* ---------- Encabezado ---------- */
.barra{
  background:linear-gradient(105deg,var(--azul) 0%,var(--azul-med) 58%,#2C56E0 100%);
  color:#fff; position:relative; overflow:hidden;
}
.barra::after{
  content:""; position:absolute; right:-70px; top:-60px; width:260px; height:260px;
  background:var(--rojo); border-radius:50%; opacity:.9;
  clip-path:polygon(0 40%,100% 0,100% 100%,0 100%);
}
.barra-in{display:flex; gap:18px; align-items:center; padding:18px 26px; position:relative; z-index:2; flex-wrap:wrap}
.logo{width:56px;height:56px;border-radius:12px;background:#fff;padding:5px;flex:0 0 auto;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.tit h1{margin:0;font-size:1.32rem;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.tit p{margin:3px 0 0;font-size:.82rem;color:#C9D6FF;font-weight:500}
.sello{
  margin-left:auto;display:flex;gap:8px;align-items:center;background:rgba(255,255,255,.12);
  border:1px solid rgba(255,255,255,.28);border-radius:999px;padding:7px 15px;font-size:.76rem;font-weight:700
}
.sello b{color:#fff}

/* ---------- Cinta de filtros ---------- */
.filtros{
  display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;
  background:#fff;border-bottom:1px solid var(--linea);padding:12px 26px;
  position:sticky;top:env(safe-area-inset-top,0px);z-index:20
}
.campo{display:flex;flex-direction:column;gap:4px;min-width:150px}
.campo label{font-size:.68rem;font-weight:700;color:var(--gris);letter-spacing:.03em}
select,input[type=number],input[type=text],input[type=password],input[type=file]{
  font-family:inherit;font-size:.86rem;padding:8px 10px;border:1.5px solid var(--linea);
  border-radius:9px;background:#fff;color:var(--tinta);min-width:140px
}
select:focus,input:focus{outline:2px solid var(--azul-med);outline-offset:1px;border-color:var(--azul-med)}
.btn{
  font-family:inherit;font-size:.84rem;font-weight:700;padding:9px 18px;border-radius:9px;border:0;
  background:var(--rojo);color:#fff;cursor:pointer;transition:background .15s
}
.btn:hover{background:var(--rojo-oscuro)}
.btn.azul{background:var(--azul)} .btn.azul:hover{background:var(--azul-med)}
.btn.linea{background:#fff;color:var(--azul);border:1.5px solid var(--linea)}
.btn.linea:hover{background:var(--azul-claro)}
.btn:focus-visible{outline:3px solid var(--ambar);outline-offset:2px}

/* ---------- Rejilla ---------- */
main{padding:20px 26px 48px;max-width:1500px;margin:0 auto}
.rej{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}
.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}
.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}
@media(max-width:1080px){.c3{grid-column:span 6}.c4,.c5,.c6,.c7,.c8{grid-column:span 12}}
@media(max-width:620px){.c3{grid-column:span 12}}

.tarjeta{background:#fff;border:1px solid var(--linea);border-radius:var(--radio);box-shadow:var(--sombra);padding:16px 18px}
.tarjeta h3{margin:0 0 2px;font-size:.95rem;font-weight:800;letter-spacing:-.01em}
.tarjeta .sub{margin:0 0 12px;font-size:.74rem;color:var(--gris)}

/* KPI */
.kpi{position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--azul)}
.kpi.rojo::before{background:var(--rojo)}
.kpi.verde::before{background:var(--verde)}
.kpi.ambar::before{background:var(--ambar)}
.kpi .rot{font-size:.72rem;font-weight:700;color:var(--gris);margin:0 0 6px}
.kpi .val{font-size:1.9rem;font-weight:800;letter-spacing:-.03em;line-height:1;margin:0}
.kpi .val small{font-size:.9rem;font-weight:700;color:var(--gris);margin-left:4px}
.kpi .pie{margin:8px 0 0;font-size:.74rem;color:var(--gris);line-height:1.45}
.kpi .pie b{color:var(--tinta)}

.barrita{height:7px;background:var(--azul-claro);border-radius:99px;overflow:hidden;margin-top:10px}
.barrita span{display:block;height:100%;border-radius:99px;background:var(--azul-med)}
.barrita span.ok{background:var(--verde)} .barrita span.mal{background:var(--rojo)} .barrita span.med{background:var(--ambar)}

/* Tablas */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.82rem}
th{
  text-align:right;font-weight:700;color:#fff;background:var(--azul);
  padding:9px 10px;white-space:nowrap;position:sticky;top:0
}
th:first-child,td:first-child{text-align:left}
td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--linea);white-space:nowrap}
tbody tr:nth-child(even){background:#FAFBFF}
tbody tr:hover{background:var(--azul-claro)}
tfoot td{font-weight:800;background:var(--azul-claro);border-top:2px solid var(--azul)}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:.72rem;font-weight:800}
.pill.ok{background:#DCF3E9;color:var(--verde)}
.pill.med{background:#FDF0D8;color:var(--ambar)}
.pill.mal{background:#FBE0E3;color:var(--rojo-oscuro)}

.grafico{position:relative;height:300px}
.grafico.alto{height:380px}
.grafico.bajo{height:210px}

/* Resumen */
.resumen{background:linear-gradient(160deg,#fff 0%,#F7F9FF 100%);border-left:5px solid var(--rojo)}
.resumen p{font-size:.88rem;line-height:1.62;margin:0 0 12px;max-width:78ch;color:#1D2748}
.resumen p:last-child{margin-bottom:0}
.notas{font-size:.72rem;color:var(--gris);line-height:1.55}

dialog{border:0;border-radius:16px;padding:0;max-width:820px;width:92%;box-shadow:0 30px 80px rgba(11,42,138,.35)}
dialog::backdrop{background:rgba(11,25,58,.55)}
dialog .cab{background:var(--azul);color:#fff;padding:16px 22px;display:flex;justify-content:space-between;align-items:center}
dialog .cab h3{margin:0;font-size:1rem}
dialog .cue{padding:20px 22px;max-height:65vh;overflow:auto}

.pie-doc{margin-top:26px;padding-top:14px;border-top:2px solid var(--linea);font-size:.72rem;color:var(--gris);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

/* Impresión */
@media print{
  @page{size:A4 landscape;margin:9mm}
  body{background:#fff}
  .filtros,.no-print{display:none!important}
  .barra{position:static}
  main{padding:0;max-width:none}
  .tarjeta{box-shadow:none;border:1px solid #C8D2EC;break-inside:avoid;page-break-inside:avoid}
  .rej{gap:9px}
  .grafico{height:230px}
  .salto{break-before:page;page-break-before:always}
}

.sup-cab{display:flex;align-items:center;gap:16px;margin-bottom:14px}
.dona{flex:0 0 auto}
.dona text{font-family:Arial,Helvetica,sans-serif;font-weight:700}
.sup-cab .nom{font-size:1.02rem;font-weight:800;margin:0;line-height:1.2}
.sup-cab .cifra{font-size:1.5rem;font-weight:800;letter-spacing:-.02em;margin:2px 0 0}
.sup-cab .cifra small{font-size:.72rem;font-weight:700;color:var(--gris);display:block;letter-spacing:0}
.equipo{list-style:none;margin:0;padding:0}
.equipo li{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;font-size:.84rem}
.equipo li+li{margin-top:4px}
.equipo li.bajo{background:#FDF1F3;border:1px solid #F6C9D0}
.equipo .punto{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
.equipo .quien{flex:1;font-weight:700}
.equipo .par{font-family:Arial,Helvetica,sans-serif;color:var(--gris);white-space:nowrap}
.equipo .par b{color:var(--tinta)}
.equipo .tanto{font-weight:800;min-width:52px;text-align:right}
.t-ok{color:var(--verde)} .t-med{color:var(--ambar)} .t-mal{color:var(--rojo)}
.cintas{display:flex;height:9px;border-radius:99px;overflow:hidden;margin-bottom:14px;background:var(--azul-claro)}
.cintas span{display:block}
.aviso{border-left:5px solid var(--rojo);background:linear-gradient(160deg,#FFF5F6 0%,#fff 70%)}
.aviso h3{color:var(--rojo-oscuro)}
.chip{display:inline-block;padding:3px 10px;border-radius:99px;font-size:.74rem;font-weight:800;margin:3px 4px 0 0}
.chip.mal{background:#FBE0E3;color:var(--rojo-oscuro)}
.chip.med{background:#FDF0D8;color:var(--ambar)}
td.sem{min-width:84px}
td.sem small{display:block;font-size:.68rem;color:var(--gris);font-weight:600}
td.fuera{color:var(--gris)}
.pestanas{display:flex;gap:8px;border-bottom:2px solid var(--linea);padding-bottom:0}
.pest{font-family:inherit;font-size:.86rem;font-weight:700;padding:10px 20px;border:0;background:transparent;color:var(--gris);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px}
.pest:hover{color:var(--azul)}
.pest.activa{color:var(--azul);border-bottom-color:var(--rojo)}
.buscador{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.buscador input{min-width:260px}
tr.grupo td{background:var(--azul-claro);font-weight:800;border-top:2px solid var(--azul)}
tr.granTotal td{background:var(--azul);color:#fff;font-weight:800}
tr.granTotal .pill{background:rgba(255,255,255,.18);color:#fff}


.armador{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:6px}
@media(max-width:1100px){.armador{grid-template-columns:repeat(2,1fr)}}
@media(max-width:620px){.armador{grid-template-columns:1fr}}
.caja{border:1.5px solid var(--linea);border-radius:10px;max-height:170px;overflow:auto;padding:6px 8px;background:#fff}
.chk{display:flex;align-items:center;gap:8px;padding:5px 4px;font-size:.84rem;font-weight:600;cursor:pointer;border-radius:6px}
.chk:hover{background:var(--azul-claro)}
.chk input{accent-color:var(--rojo);width:16px;height:16px;flex:0 0 auto}
.chk small{color:var(--gris);font-weight:500;font-size:.72rem;white-space:nowrap}
.atajos{margin:6px 0 0;font-size:.76rem}
.atajos a{color:var(--azul-med);font-weight:700;cursor:pointer;margin-right:12px}
.atajos a:hover{text-decoration:underline}
.vacio{font-size:.8rem;color:var(--gris);margin:6px}
.parametros{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:18px}
@media(max-width:1100px){.parametros{grid-template-columns:repeat(2,1fr)}}
.parametros .campo{min-width:0}
.parametros select,.parametros input{width:100%}
.pest-link{font-family:inherit;font-size:.86rem;font-weight:700;padding:10px 20px;color:var(--rojo);text-decoration:none;border-bottom:3px solid transparent;margin-bottom:-2px;margin-left:auto}
.pest-link:hover{color:var(--rojo-oscuro);border-bottom-color:var(--rojo)}
.logo-nestle{width:auto;max-width:120px;object-fit:contain;padding:0;margin-left:-6px;background:#0F5FA8;border-radius:12px}
/* ---- reporte adaptable ---- */
.rotb{font-size:.7rem;font-weight:800;color:var(--gris);letter-spacing:.04em;margin:12px 0 6px;text-transform:uppercase}
.botonera{display:flex;flex-wrap:wrap;gap:8px}
.rb{font-family:inherit;font-size:.82rem;font-weight:700;padding:8px 14px;border-radius:99px;border:1.5px solid var(--linea);background:#fff;color:var(--azul);cursor:pointer}
.rb:hover{background:var(--azul-claro)}
.rb.on{background:var(--azul);border-color:var(--azul);color:#fff}
.documento{background:#fff;border:1px solid var(--linea);border-radius:var(--radio);box-shadow:var(--sombra);padding:34px 40px;max-width:980px;margin:0 auto;width:100%}
.documento table tr{break-inside:avoid}
@page reporte{size:A4 portrait;margin:14mm}
@media print{
  body.imp-reporte header, body.imp-reporte .filtros, body.imp-reporte #resumen, body.imp-reporte .pestanas,
  body.imp-reporte main > .rej:not(#reporte), body.imp-reporte .pie-doc, body.imp-reporte #reporte > .tarjeta{display:none!important}
  body.imp-reporte #reporte{display:block!important;margin:0!important}
  body.imp-reporte .documento{page:reporte;box-shadow:none;border:0;padding:0;max-width:none;border-radius:0}
}

/* ---- vista adaptable a teléfonos (5" a 6,7") ---- */
.pestanas{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.pest,.pest-link{white-space:nowrap;flex:0 0 auto}
@media(max-width:600px){
  .barra-in{padding:12px 14px!important;gap:10px!important}
  .logo{width:42px!important;height:42px!important;border-radius:10px!important}
  .tit h1{font-size:1.05rem!important;line-height:1.2}
  .tit p{font-size:.7rem!important;line-height:1.35}
  .sello{font-size:.66rem!important;padding:5px 10px!important;max-width:100%!important;margin-left:0!important}
  .filtros{position:static!important;padding:10px 12px!important;gap:8px!important}
  .filtros .campo{min-width:0!important;flex:1 1 100%}
  .filtros select,.filtros input{width:100%!important;min-width:0!important;font-size:16px}
  .filtros .btn{flex:1 1 calc(50% - 8px);padding:11px 8px;font-size:.8rem}
  #estado{margin-left:0!important;width:100%;font-size:.7rem!important}
  main{padding:12px 10px 28px!important}
  .rej{gap:10px!important}
  .tarjeta{padding:14px!important;border-radius:12px}
  .kpi .val{font-size:1.6rem!important}
  .pest{padding:10px 12px!important;font-size:.8rem!important}
  .tw{max-width:100%}
  table{font-size:.76rem}
  th,td{padding:7px 8px!important}
  .equipo li{flex-wrap:wrap}
  .equipo .quien{flex:1 1 60%}
  .buscador input{min-width:0!important;width:100%}
  .pie-doc{flex-direction:column;gap:4px;font-size:.66rem}
}
@media(max-width:380px){ .tit p{display:none} .filtros .btn{font-size:.74rem;padding:10px 6px} }

/* ---- teléfonos en horizontal y pantallas con muesca (1792x828, 2280x1080, 2436x1125, 2520x1080, 3040x1440) ---- */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
@media(max-width:1180px){
  .hoja table{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%}
  .hoja{max-width:100%}
}
@media(max-height:520px){
  .filtros{position:static!important}
  .barra-in{padding-top:10px!important;padding-bottom:10px!important}
  .acceso{min-height:auto!important;padding:16px!important}
}
@media(max-height:520px) and (min-width:600px){
  .tit p{display:none}
  .logo{width:44px!important;height:44px!important}
}

/* ---- matriz de activación (igual a la hoja de la coordinación) ---- */
.mx-wrap{overflow:auto;-webkit-overflow-scrolling:touch;max-height:78vh;border:1px solid var(--linea);border-radius:12px;background:#fff}
.mx{border-collapse:separate;border-spacing:0;font-size:.74rem;min-width:1500px;width:100%}
.mx th,.mx td{padding:5px 7px;border-right:1px solid #E3E8F4;border-bottom:1px solid #E3E8F4;text-align:center;white-space:nowrap}
.mx thead th{background:#1F5FBF;color:#fff;font-weight:800;position:sticky;z-index:2}
.mx thead tr:nth-child(1) th{top:0;background:#1F5FBF}
.mx thead tr:nth-child(2) th{top:26px;background:#2F6FD0}
.mx thead tr:nth-child(3) th{top:52px;background:#F8C9A8;color:#0E1A38}
.mx thead tr:nth-child(4) th{top:78px;background:#0B4FB3}
.mx tbody td:first-child{position:sticky;left:0;z-index:1;text-align:left;background:#fff;min-width:150px}
.mx thead tr:first-child th:first-child{position:sticky;left:0;z-index:3;background:#0B4FB3;text-align:left;min-width:150px}
.mx tr.sup td{background:#D9DDE6;font-weight:800}
.mx tr.sup td:first-child{background:#D9DDE6}
.mx tr.tot td{background:#0B2A6E;color:#fff;font-weight:800}
.mx tr.tot td:first-child{background:#0B2A6E}
.mx .ok{color:#1A73E8;font-weight:700}
.mx .bajo{color:#E5142B;font-weight:700}
.mx .ic-ok{color:#128C5A;font-weight:900}
.mx .ic-al{color:#E0A100;font-weight:900}
.mx td.bk{border-left:2px solid #9BB4E6}
.mx-cab{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:0 0 10px}
.mx-cab .chip{background:#FCE3D3;border-radius:999px;padding:5px 12px;font-weight:800;font-size:.78rem}
@media(max-width:600px){ .mx{font-size:.68rem} .mx th,.mx td{padding:4px 5px} .mx tbody td:first-child,.mx thead tr:first-child th:first-child{min-width:118px} }
@media print{ .mx-wrap{max-height:none;overflow:visible} .mx{min-width:0;font-size:6.5pt} }

/* ---- filtro por fechas ---- */
.campo-fecha input[type=date]{font-family:inherit;font-size:.9rem;padding:8px 10px;border:1.5px solid var(--linea);border-radius:10px;background:#fff;color:var(--tinta);min-width:150px}
.nota-rango{flex:1 1 100%;margin:2px 0 0;font-size:.76rem;color:var(--gris)}
.nota-rango b{color:var(--azul)}
@media(max-width:600px){ .campo-fecha{flex:1 1 calc(50% - 8px)!important} .campo-fecha input[type=date]{width:100%;min-width:0;font-size:16px} }

/* ---- coordinaciones: lista desplegable con selección múltiple ---- */
.multi{position:relative}
.multi-btn{width:100%;min-width:210px;text-align:left;font-family:inherit;font-size:.9rem;padding:9px 34px 9px 12px;border:1.5px solid var(--linea);border-radius:10px;background:#fff;color:var(--tinta);cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,var(--gris) 50%),linear-gradient(135deg,var(--gris) 50%,transparent 50%);background-position:calc(100% - 17px) 55%,calc(100% - 12px) 55%;background-size:5px 5px;background-repeat:no-repeat;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.multi-panel{position:absolute;z-index:40;top:calc(100% + 6px);left:0;min-width:100%;background:#fff;border:1.5px solid var(--linea);border-radius:12px;box-shadow:0 12px 30px rgba(11,25,58,.18);padding:8px}
.multi-acc{display:flex;gap:6px;margin-bottom:6px}
.multi-acc button{flex:1;font-family:inherit;font-size:.74rem;font-weight:800;border:1.5px solid var(--linea);background:#F4F6FC;color:var(--azul);border-radius:8px;padding:6px 8px;cursor:pointer}
.multi-acc #bSupListo{background:var(--azul);color:#fff;border-color:var(--azul)}
.multi-op{display:flex;align-items:center;gap:10px;padding:9px 8px;border-radius:8px;font-size:.86rem;font-weight:700;cursor:pointer;white-space:nowrap}
.multi-op:hover{background:#F4F6FC}
.multi-op input,.filtros .multi-op input,.armar .multi-op input{width:18px!important;min-width:18px!important;height:18px;flex:0 0 18px;padding:0!important;margin:0;accent-color:var(--azul)}
.campo .multi-op,.armar .multi-op{display:flex!important;flex-direction:row!important;justify-content:flex-start!important;align-items:center;gap:10px;font-size:.86rem!important;font-weight:700!important;color:var(--tinta)!important;letter-spacing:0!important;text-transform:none}
@media(max-width:600px){ .multi-btn{min-width:0;font-size:16px} .multi-panel{position:absolute;left:0;right:0;width:auto;padding:10px;max-height:60vh;overflow:auto} .campo .multi-op,.armar .multi-op{padding:12px 8px;font-size:1rem!important} }
@media print{ .multi-panel{display:none!important} }

/* ---- rótulos Meta / Activados / Falta sobre los números ---- */
.cifra.et2{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap}
.cifra .et-n{display:inline-flex;flex-direction:column;line-height:1.05}

/* =====================================================================
   ACABADO PROFESIONAL (capa visual; no cambia estructura ni cálculos)
   ===================================================================== */
:root{
  --azul:#0A2A7A; --azul-med:#1B47C9; --azul-claro:#EEF2FC; --papel:#F3F5FA; --tinta:#0F1B3D; --gris:#5F6B8A; --linea:#E1E6F2;
  --verde:#0F8A5F; --ambar:#C97A00; --rojo:#D7192E;
  --sombra:0 1px 2px rgba(15,27,61,.06), 0 6px 18px rgba(15,27,61,.06); --radio:14px;
}
body{font-family:'Manrope',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;letter-spacing:-.005em}
/* encabezado: limpio, con acento rojo de marca */
.barra{background:linear-gradient(120deg,#08205F 0%,#0D2F8C 55%,#1743BD 100%)}
.barra::after{right:-120px;top:auto;bottom:-170px;width:420px;height:300px;opacity:.95;border-radius:0;clip-path:polygon(40% 0,100% 0,100% 100%,0 100%);background:linear-gradient(135deg,#E5142B,#B30F22)}
.barra::before{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,#E5142B 0,#E5142B 30%,transparent 30%);z-index:3}
.barra-in{padding:16px 28px 18px}
.logo{border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.22)}
.tit h1{font-size:1.28rem;letter-spacing:-.025em}
.tit p{color:#B9C8F2;font-size:.8rem}
.sello{background:rgba(255,255,255,.10);border-color:rgba(255,255,255,.22);font-weight:700;font-size:.72rem;padding:6px 13px;backdrop-filter:blur(4px)}
/* barra de filtros como panel ordenado */
.filtros{background:#fff;border-bottom:1px solid var(--linea);box-shadow:0 2px 10px rgba(15,27,61,.05);padding:14px 28px 12px;gap:12px 14px}
.campo label{font-size:.64rem;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:#7A86A6}
select,input[type=number],input[type=text],input[type=date],.multi-btn{height:40px;border:1px solid #D5DCEC!important;border-radius:10px!important;background-color:#FBFCFF;transition:border-color .15s,box-shadow .15s}
select:hover,input:hover,.multi-btn:hover{border-color:#B9C4E2!important}
select:focus,input:focus,.multi-btn:focus{outline:none;border-color:var(--azul-med)!important;box-shadow:0 0 0 3px rgba(27,71,201,.15)}
.btn{height:40px;border-radius:10px;font-weight:800;letter-spacing:.01em;box-shadow:0 1px 2px rgba(15,27,61,.12)}
.btn.linea{box-shadow:none;border:1px solid #D5DCEC}
.nota-rango{background:#F5F7FD;border:1px solid var(--linea);border-radius:10px;padding:8px 12px;color:var(--gris)}
.nota-rango a{color:var(--azul-med);font-weight:800}
#estado{font-size:.72rem}
main{padding:22px 28px 52px}
/* tarjetas */
.tarjeta{border:1px solid var(--linea);border-radius:var(--radio);box-shadow:var(--sombra);padding:18px 20px}
.tarjeta h3{font-size:.98rem;font-weight:800;letter-spacing:-.015em;color:var(--tinta)}
.tarjeta .sub{font-size:.74rem;color:var(--gris);line-height:1.5}
/* indicadores: acento superior en lugar de franja lateral */
.kpi::before{left:0;right:0;top:0;bottom:auto;width:auto;height:3px}
.kpi .rot{font-size:.66rem;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:#7A86A6}
.kpi .val{font-size:2rem;letter-spacing:-.035em;margin-top:2px}
.kpi .pie{font-size:.74rem;color:var(--gris);line-height:1.5}
.barrita{height:6px;border-radius:99px;background:#EDF0F8}
/* pestañas tipo control segmentado */
.pestanas{border-bottom:0;background:#E9EDF7;border-radius:12px;padding:4px;display:inline-flex;gap:4px;max-width:100%}
.pest{border:0!important;border-radius:9px;padding:9px 18px;margin:0!important;color:#4E5A7A;font-weight:800;font-size:.84rem}
.pest:hover{color:var(--azul)}
.pest.activa{background:#fff;color:var(--azul);box-shadow:0 1px 3px rgba(15,27,61,.14)}
/* tablas */
table{font-size:.82rem}
thead th{background:#0E2A78;color:#fff;font-size:.68rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:10px 12px;position:sticky;top:0;z-index:1}
thead th:first-child{border-top-left-radius:10px} thead th:last-child{border-top-right-radius:10px}
tbody td{padding:9px 12px;border-bottom:1px solid #EEF1F8}
tbody tr:nth-child(even){background:#FAFBFE}
tbody tr:hover{background:#EEF3FF}
tfoot td{background:#EEF2FC;border-top:2px solid #0E2A78}
.pill{padding:3px 10px;font-size:.7rem;letter-spacing:.01em}
.tw{border-radius:10px}
/* listas de alerta y equipos: filas limpias con indicador lateral */
.equipo li{border-radius:10px;transition:background .12s}
.equipo li:hover{background:#F5F7FD}
.equipo li.bajo{background:#FFF6F7;border:1px solid #F8D7DC;box-shadow:inset 3px 0 0 var(--rojo)}
.cintas{height:7px}
.sup-cab .nom{letter-spacing:-.01em}
.notas{color:#6B7695}
.pie-doc{border-top:1px solid var(--linea);color:#7A86A6}
@media(max-width:600px){
  .barra-in{padding:12px 14px 14px!important}
  .pestanas{display:flex;border-radius:10px}
  .pest{padding:9px 12px!important}
  .kpi .val{font-size:1.6rem}
  thead th{padding:8px 8px}
  tbody td{padding:8px 8px}
}
@media(max-width:600px){.barra::after{width:200px;height:220px;right:-90px;bottom:-150px;opacity:.9}}
@media print{
  .barra::before,.barra::after{display:none}
  .pestanas{background:none}
  thead th{position:static}
}
/* =====================================================================
   INVENTARIO · piezas propias (misma línea visual del tablero KPI Nestlé)
   ===================================================================== */
/* panel administrativo */
.zona-carga{border:2px dashed var(--linea);border-radius:14px;padding:26px;text-align:center;background:#FAFBFF;transition:border-color .15s,background .15s}
.zona-carga.activa{border-color:var(--azul-med);background:var(--azul-claro)}
.zona-carga p{margin:6px 0 0;font-size:.8rem;color:var(--gris)}
.filaparam{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.filaparam .campo{min-width:0}
.filaparam input{width:100%}
.log{font-size:.78rem;line-height:1.6;background:#0E1B3F;color:#C9D6FF;border-radius:10px;padding:14px;max-height:220px;overflow:auto;font-family:ui-monospace,Menlo,monospace}
.log b{color:#fff}
.ok-msg{background:#DCF3E9;color:var(--verde);border-radius:10px;padding:10px 14px;font-size:.82rem;font-weight:700;display:inline-block}
.archivos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px}
.archivos .arch{border:1px solid var(--linea);border-radius:12px;padding:10px 12px;background:#fff;font-size:.78rem;line-height:1.45}
.archivos .arch b{display:block;font-size:.66rem;letter-spacing:.07em;text-transform:uppercase;color:#7A86A6}
.archivos .arch.ok{border-color:#BFE6D4;background:#F3FBF7}
.archivos .arch.falta{border-color:#F8D7DC;background:#FFF8F9}
.archivos .arch span{font-weight:800;color:var(--tinta);word-break:break-all}
@media(max-width:800px){.archivos{grid-template-columns:1fr}}

/* reporte */
.armar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 14px;margin-top:10px}
.armar .campo{display:flex;flex-direction:column;gap:5px;min-width:0}
.armar label{font-size:.64rem!important;font-weight:800!important;letter-spacing:.07em;text-transform:uppercase;color:#7A86A6!important}
.armar select,.armar input{width:100%;min-width:0;height:40px;font-family:inherit;font-size:.9rem;padding:8px 10px;border:1px solid #D5DCEC!important;border-radius:10px!important;background:#FBFCFF;color:var(--tinta)}
.armar .multi-btn{font-size:.9rem;padding:9px 34px 9px 10px;min-width:0}
.hoja{background:#fff;max-width:960px;margin:0 auto;padding:34px 40px;border:1px solid var(--linea);border-radius:14px;box-shadow:0 1px 2px rgba(15,27,61,.06),0 10px 28px rgba(15,27,61,.08)}
@media(max-width:1100px){.armar{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:600px){
  .armar{grid-template-columns:1fr;gap:10px}
  .armar select,.armar input,.armar .multi-btn{font-size:16px}
  .hoja{padding:16px 12px;border-radius:10px}
  .hoja table{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%}
  .hoja th,.hoja td{white-space:nowrap}
  .hoja td[style*="text-align:left"]{white-space:normal;min-width:170px}
  #bVolver{flex-basis:100%!important}
}
@media print{
  @page{size:A4 portrait;margin:12mm}
  .hoja{border:0;box-shadow:none;padding:0;max-width:none;border-radius:0}
  body.doc .barra,body.doc .pie-doc{display:none!important}
  body.doc main{padding:0}
}

/* tablero: unidades de negocio */
.eq-cab,.equipo.cols li{grid-template-columns:12px minmax(0,1fr) 66px 66px 62px 78px}
@media(max-width:600px){ .eq-cab,.equipo.cols li{grid-template-columns:10px minmax(0,1fr) 50px 50px 46px 62px} }
.equipo .quien small{display:block;font-weight:500;color:var(--gris);font-size:.72rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.equipo .quien{min-width:0;overflow:hidden;text-overflow:ellipsis}
.etq{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:99px;font-size:.62rem;font-weight:800;letter-spacing:.04em;background:#FCE3D3;color:#9A4A12;vertical-align:middle;text-transform:uppercase}
.leyenda{display:flex;flex-wrap:wrap;gap:6px 14px;margin:0 0 10px;font-size:.72rem;color:var(--gris);font-weight:700}

.c-cu{background:var(--verde)} .c-df{background:var(--ambar)} .c-smv{background:#9DB2EE} .c-smb{background:#F2A3AD} .c-mv{background:var(--azul-med)} .c-mb{background:var(--rojo)}
.pill.smv{background:#E3EAFB;color:var(--azul-med)} .pill.smb{background:#FBE0E3;color:var(--rojo-oscuro)} .pill.gris{background:#EEF1F8;color:var(--gris)}
td.neg{color:var(--rojo-oscuro);font-weight:700} td.pos{color:var(--azul-med);font-weight:700}
td.cod{font-family:ui-monospace,Menlo,monospace;font-size:.74rem;color:var(--gris)}
td.prod{text-align:left!important;white-space:normal!important;min-width:220px}
th.ord{cursor:pointer;user-select:none}
th.ord::after{content:" ↕";opacity:.45}
th.ord.asc::after{content:" ↑";opacity:1} th.ord.desc::after{content:" ↓";opacity:1}
.alto-tabla{max-height:620px;overflow:auto}
.alto-tabla thead th{position:sticky;top:0;z-index:2}
/* el mismo artículo en cada sistema: cada lado con su propia escala */
.mar{display:grid;gap:6px}
.mar .fila{display:grid;grid-template-columns:minmax(0,34%) 1fr 1fr;gap:10px;align-items:center;font-size:.78rem}
.mar .nom{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.mar .lado.mv .bar{background:var(--azul-med)} .mar .lado.mb .bar{background:var(--rojo)}

@media(max-width:600px){ .mar .fila{grid-template-columns:1fr 1fr} .mar .nom{grid-column:1 / -1} .mar .cab span:first-child{display:none} }
/* cobertura */
.cov{display:grid;gap:6px;position:relative}
.cov .fila{display:grid;grid-template-columns:minmax(0,42%) 1fr;gap:10px;align-items:center;font-size:.78rem}
.cov .nom{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cov .pista{position:relative;height:14px}
.cov .bar{position:absolute;left:0;top:0;bottom:0;border-radius:4px}
.cov .v{position:absolute;top:-1px;font-size:.72rem;font-weight:700;color:var(--gris);white-space:nowrap;padding-left:5px}
.cov .ref{position:absolute;top:-4px;bottom:-4px;border-left:1.5px dashed #9AA6C6}
.cov .reft{position:absolute;top:-16px;transform:translateX(-50%);font-size:.62rem;font-weight:800;color:#7A86A6}
.notas b{color:var(--tinta)}

/* ===== INVENTARIO: slicer, módulo, fuentes y carga manual ===== */
.slicer{display:flex;flex-wrap:wrap;gap:6px}
.sl{font-family:inherit;height:40px;display:inline-flex;align-items:center;gap:8px;padding:0 14px;border-radius:10px;border:1px solid #D5DCEC;background:#FBFCFF;color:#4E5A7A;font-weight:800;font-size:.82rem;cursor:pointer;transition:background .12s,border-color .12s}

.sl:hover{border-color:#B9C4E2}
.sl.on{background:var(--azul);border-color:var(--azul);color:#fff}
.sl.on i{opacity:1;box-shadow:0 0 0 2px rgba(255,255,255,.7)}
.sl.on b{background:rgba(255,255,255,.18);color:#fff}
.m-mb{background:var(--rojo)} .m-mv{background:var(--azul-med)} .m-dif{background:var(--ambar)} .m-carga{background:var(--verde)}
.campo-busca{flex:1 1 300px}
.campo-busca input{width:100%}
.mod{display:inline-block;padding:3px 10px;border-radius:99px;font-size:.68rem;font-weight:800;white-space:nowrap;letter-spacing:.02em}
.mod.mb{background:#FBE0E3;color:var(--rojo-oscuro)} .mod.mv{background:#E3EAFB;color:var(--azul-med)} .mod.dif{background:#FDF0D8;color:#9A5A00} .mod.carga{background:#DCF3E9;color:var(--verde)}
tr.r-dif td{background:#FFFCF6}

.fu-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 18px}

.fu-grid b{display:block;font-size:.62rem;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:#7A86A6}
@media(max-width:900px){.fu-grid{grid-template-columns:1fr 1fr}}
@media(max-width:560px){.fu-grid{grid-template-columns:1fr}}
.barras{display:grid;gap:7px}
.barras .fila{display:grid;grid-template-columns:minmax(0,38%) 1fr;gap:10px;align-items:center;font-size:.78rem}
.barras .nom{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.barras .pista{position:relative;height:16px}
.barras .bar{position:absolute;left:0;top:0;bottom:0;border-radius:4px}

.tcarga input.conteo{width:110px;min-width:0;height:34px;text-align:right;font-weight:800;border:1px solid #CFE8DB!important;background:#F6FCF9}
.tcarga input.conteo:focus{border-color:var(--verde)!important;box-shadow:0 0 0 3px rgba(15,138,95,.15)}

.mini{display:block;font-size:.62rem;color:var(--gris);font-weight:700}

@media print{ #carga,#cuadro .buscador{display:none!important} }

.campo-busca input{height:40px;font-family:inherit;font-size:.86rem;padding:8px 12px;border:1px solid #D5DCEC!important;border-radius:10px!important;background:#FBFCFF;color:var(--tinta)}
.campo-busca input:focus{outline:none;border-color:var(--azul-med)!important;box-shadow:0 0 0 3px rgba(27,71,201,.15)}

.act{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
@media(max-width:800px){.act{grid-template-columns:1fr}}
.act .box{background:#fff;border:1px solid var(--linea);border-radius:14px;padding:12px 16px;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:center;box-shadow:0 1px 2px rgba(15,27,61,.05)}
.act .box .ico{grid-row:1 / span 3;width:46px;height:46px;border-radius:12px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:.6rem;letter-spacing:.02em}
.act .box.inv .ico{background:linear-gradient(135deg,var(--rojo) 0 50%,var(--azul-med) 50% 100%)}
.act .box.ven .ico{background:var(--violeta)}
.act .t{font-size:.64rem;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:#7A86A6}
.act .h{font-size:1.05rem;font-weight:800;color:var(--tinta)}
.act .d{font-size:.74rem;color:var(--gris);line-height:1.4}
.act .orden{grid-column:1 / -1;font-size:.76rem;font-weight:700;border-radius:10px;padding:8px 12px}
.act .orden.ok{background:#DCF3E9;color:var(--verde)} .act .orden.av{background:#FDF0D8;color:#9A5A00}
.tw table td.gsep,.tw table th.gsep{border-left:2px solid #DDE3F2}

.tcuadro td.det{text-align:left;white-space:normal;min-width:170px;color:var(--gris);font-size:.76rem;line-height:1.35}
.tcuadro tbody tr td{background:#fff} .tcuadro tbody tr:nth-child(even) td{background:#FAFBFE}
.tcuadro .mod{display:block;width:max-content;margin:2px 0;font-size:.64rem;padding:2px 8px}
.tcuadro td.prod{min-width:180px}
.tcuadro td.det{min-width:150px}
.tcuadro th,.tcuadro td{padding-left:8px;padding-right:8px}
.tcuadro tbody td:nth-child(4){max-width:150px;white-space:normal}
.tcuadro tbody td:nth-child(5){max-width:110px;white-space:normal}

/* doble auditoría */
.sec-aud{display:flex;gap:14px;align-items:center;margin-top:8px;padding:4px 2px}
.sec-aud .num{flex:none;width:38px;height:38px;border-radius:12px;background:var(--azul);color:#fff;display:grid;place-items:center;font-weight:800;font-size:1.05rem}
.sec-aud h2{margin:0;font-size:1.12rem;font-weight:800;color:var(--tinta)}
.sec-aud p{margin:2px 0 0;font-size:.8rem;color:var(--gris);line-height:1.45;max-width:1000px}


</style>

<script>
/* ============================================================
   VENEJUGOS · Motor de conciliación de inventario
   MobilVendor (sistema de ventas) frente a Módulo B (administración)
   ============================================================ */
const VJI = (function () {
  const PARAMS = { riesgo: 7, meta: 30, sobre: 60, tol: 0 };
  /* Unidades de negocio que cada sistema mide distinto: se ven aparte y no se restan unidades entre sistemas */
  const PROPIAS = ["NESTLE", "PEPSICO"];
  const ESTADOS = ["Cuadra", "Difiere", "Solo MobilVendor", "Solo Módulo B"];
  const METODOS = ["Código", "Código sin ceros", "Nombre", "Sin pareja"];

  const nf = (d) => new Intl.NumberFormat("es-VE", { minimumFractionDigits: d, maximumFractionDigits: d });
  const N0 = nf(0), N1 = nf(1), N2 = nf(2);
  const f0 = v => v == null || !isFinite(v) ? "—" : N0.format(v);
  const f1 = v => v == null || !isFinite(v) ? "—" : N1.format(v);
  const fq = v => v == null || !isFinite(v) ? "—" : (Math.abs(v - Math.round(v)) < 0.005 || Math.abs(v) >= 1000 ? N0.format(v) : N2.format(v));
  const fp = v => v == null || !isFinite(v) ? "—" : N1.format(v) + "%";
  const fu = v => v == null || !isFinite(v) ? "—" : "$" + N0.format(v);
  const fus = v => v == null || !isFinite(v) ? "—" : (v > 0 ? "+" : v < 0 ? "−" : "") + "$" + N0.format(Math.abs(v));
  const fk = v => { if (v == null || !isFinite(v)) return "—"; const a = Math.abs(v), s = v < 0 ? "−" : ""; return s + (a >= 1e6 ? "$" + N1.format(a / 1e6) + " M" : a >= 1e3 ? "$" + N1.format(a / 1e3) + " mil" : "$" + N0.format(a)); };
  const fecha = iso => { if (!iso) return "—"; const [y, m, d] = String(iso).split("-"); return d + "/" + m + "/" + y; };
  const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const norm = s => String(s == null ? "" : s).normalize("NFKD").replace(/[\u0300-\u036f]/g, "").toUpperCase().trim();
  /* color por exactitud: verde ≥ 95 %, ámbar ≥ 80 %, rojo < 80 % */
  const sem = p => p == null ? "" : p >= 95 ? "ok" : p >= 80 ? "med" : "mal";

  /* Filas del dataset con su estado y diferencia */
  function filas(ds) {
    const P = Object.assign({}, PARAMS, ds.params || {});
    const tol = Math.max(0.01, Number(P.tol) || 0);
    const dias = ds.ventas && ds.ventas.dias || 0;
    return ds.r.map(a => {
      const o = {}; ds.cols.forEach((k, i) => { o[k] = a[i]; });
      const enMV = o.inv_mv != null, enMB = o.stock_mb != null;
      o.valor_mb = enMB ? o.stock_mb * (o.costo_mb || 0) : null;
      o.dif = enMV && enMB ? o.inv_mv - o.stock_mb : null;
      o.dif_valor = (o.valor_mv || 0) - (o.valor_mb || 0);
      o.estado = enMV && enMB ? (Math.abs(o.dif) < tol ? "Cuadra" : "Difiere") : enMV ? "Solo MobilVendor" : "Solo Módulo B";
      o.mbCero = o.estado === "Difiere" && o.stock_mb === 0;
      o.propia = PROPIAS.indexOf(o.unidad) > -1;
      o.diaria = dias && o.vendido != null ? o.vendido / dias : null;
      o.cobertura = o.diaria > 0 && enMV ? o.inv_mv / o.diaria : null;
      o.alerta = o.vendido == null ? "" : o.cobertura == null ? (enMV && o.inv_mv > 0 ? "Sin venta" : "") : o.cobertura < P.riesgo ? "Riesgo" : o.cobertura > P.sobre ? "Sobrestock" : "OK";
      /* Inventario del sistema = MobilVendor + Módulo B, en la unidad de MobilVendor.
         Donde Módulo B usa otra presentación (Nestlé, PepsiCo) se convierte con un factor
         estimado por costos: costo Módulo B ÷ (costo MobilVendor × 1,16 de IVA), redondeado. */
      o.factor_mb = 1; o.factorOk = true; o.factorEst = false;
      if (o.propia && enMB && enMV && o.costo_mv > 0 && o.costo_mb > 0) {
        const r = o.costo_mb / (o.costo_mv * 1.16), ri = Math.round(r);
        if (ri >= 1 && Math.abs(r - ri) / ri < 0.03) { o.factor_mb = ri; o.factorEst = ri !== 1; }
        else o.factorOk = false;
      }
      o.mb_conv = enMB ? o.stock_mb * o.factor_mb : null;
      o.total_sis = (o.inv_mv || 0) + (o.mb_conv || 0);
      o.valor_total = (o.valor_mv || 0) + (o.valor_mb || 0);
      o.medida = enMV ? (o.ui || "unidad MV") : "presentación MB";
      o.costo_ref = enMV && o.costo_mv != null ? o.costo_mv : (o.costo_mb || 0);
      return o;
    });
  }

  function totales(F) {
    const t = { articulos: F.length, cuadra: 0, difiere: 0, soloMV: 0, soloMB: 0, mbCero: 0, valorMV: 0, valorMB: 0 };
    F.forEach(f => {
      if (f.estado === "Cuadra") t.cuadra++; else if (f.estado === "Difiere") t.difiere++;
      else if (f.estado === "Solo MobilVendor") t.soloMV++; else t.soloMB++;
      if (f.mbCero) t.mbCero++;
      t.valorMV += f.valor_mv || 0; t.valorMB += f.valor_mb || 0;
    });
    t.enAmbos = t.cuadra + t.difiere;
    t.noCuadran = t.articulos - t.cuadra;
    t.exactitud = t.enAmbos ? 100 * t.cuadra / t.enAmbos : null;
    t.brecha = t.valorMV - t.valorMB;
    return t;
  }

  function porUnidad(F, orden) {
    const g = new Map();
    F.forEach(f => { if (!g.has(f.unidad)) g.set(f.unidad, []); g.get(f.unidad).push(f); });

        if (f.est2 !== "Cuadra") R.push(Object.assign({ m: "dif", det: `${f.est2}: conteo ${fq(f.c)} − sistema ${fq(f.total_sis)} (${sistemaTxt(f)})`, cant: f.difc, med: f.medida, costo: null, valor: f.difc_valor }, base));
      }
    });
    R.forEach(r => { r.txt = " " + nb([MOD[r.m], r.codigo, r.f.codigo_mb, r.producto, r.unidad, r.det, fq(r.cant), r.med].join(" ")) + " "; });
    return R;
  }

  /* ---------- piezas visuales ---------- */
  function dona(pct, tam, col) {

    return `<svg class="dona" width="${tam}" height="${tam}" viewBox="0 0 ${tam} ${tam}"><circle cx="${tam/2}" cy="${tam/2}" r="${R}" fill="none" stroke="#E8EDFB" stroke-width="9"></circle>
      <circle cx="${tam/2}" cy="${tam/2}" r="${R}" fill="none" stroke="${col}" stroke-width="9" stroke-linecap="round" stroke-dasharray="${(C*p/100).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 ${tam/2} ${tam/2})"></circle>
      <text x="50%" y="50%" text-anchor="middle" dy=".35em" font-size="${tam*0.23}" fill="${col}">${pct == null ? "—" : Math.round(pct) + "%"}</text></svg>`;

  function barras(items, colorBar, fmt) {
    const max = Math.max(1, ...items.map(i => Math.abs(i.v)));

  const cintas2 = t => [["cuadra", "Cuadra"], ["faltante", "Faltante"], ["sobrante", "Sobrante"], ["sinContar", "Sin contar"]].map(([k, e]) => t[k] ? `<span style="width:${100 * t[k] / (t.articulos || 1)}%;background:${COL2[e]}"></span>` : "").join("");
  const leyenda2 = `<div class="leyenda"><span><i style="background:var(--verde)"></i>Cuadra</span><span><i style="background:var(--rojo)"></i>Faltante (conteo menor que el sistema)</span><span><i style="background:var(--ambar)"></i>Sobrante (conteo mayor)</span><span><i style="background:#C9D1E6"></i>Sin contar</span></div>`;
  function fuente(m) {
    const A = DS.archivos || {}, Fe = DS.fechas || {}, C = DS.conteo || {};
    if (m === "mb") return `<div class="tarjeta fuente c12" style="border-left:5px solid var(--rojo)">
      <h3>De dónde viene la información · Módulo B</h3>

        <div><b>Artículos en el archivo</b>${f0(C.mb)} · ${f0(C.mbConStock)} con stock</div>

      <div class="fu-grid">
        <div><b>Sistema</b>MobilVendor (ventas), bodega ${esc(DS.bodega || "—")}</div>
        <div><b>Archivo</b>${esc(A.mv || "—")}</div>
        <div><b>Corte del exporte</b>${esc(DS.corte || "—")}</div>
        <div><b>Procesado / publicado</b>${esc(DS.generado || "—")}${DS.publicado ? " · " + esc(DS.publicado) : ""}</div>
        <div><b>Artículos en el archivo</b>${f0(C.mv)}</div>
        <div><b>Columnas usadas</b>Artículo · Artículo (Nombre) · Inventario · Balance (Cajas)</div>

  function topUnidades(L, k) {
    const m = new Map(); L.forEach(f => m.set(f.unidad, (m.get(f.unidad) || 0) + (f[k] || 0)));

      <div class="tarjeta kpi ambar c3"><p class="rot">Solo en MobilVendor</p><p class="val">${f0(M.filter(f => f.stock_mb == null).length)}</p><p class="pie">Artículos que no están en Módulo B por código ni por nombre</p></div>

    const top = L.filter(f => f.total_sis > 0 || f.c != null).sort((a, b) => (b.total_sis || 0) - (a.total_sis || 0)).slice(0, 12);
    const max = Math.max(1, ...top.map(f => Math.max(f.total_sis, f.c || 0)));
    return `<div class="apil">` + top.map(f => {
      const wmv = 82 * (f.inv_mv || 0) / max, wmb = 82 * (f.mb_conv || 0) / max, wc = f.c == null ? null : 82 * f.c / max;
      return `<div class="fila"><span class="nom" title="${esc(f.producto)}">${esc(f.producto)}</span><span class="pista">
        <span class="seg mv" style="width:${wmv}%"></span><span class="seg mb" style="left:${wmv}%;width:${wmb}%"></span>
        ${wc != null ? `<span class="marca" style="left:${wc}%" title="Conteo ${fq(f.c)}"></span>` : ""}
        <span class="v" style="left:${Math.max(wmv + wmb, wc || 0)}%">${fq(f.total_sis)}${f.c != null ? ` · conteo <b class="${f.est2 === "Faltante" ? "t-mal" : f.est2 === "Sobrante" ? "t-med" : "t-ok"}">${fq(f.c)}</b>` : ""}</span></span></div>`;

  /* Auditoría 1 · directa del sistema: unidades cargadas en MobilVendor y Módulo B contra las ventas */

    const X = L.filter(f => f.vendido > 0).sort((a, b) => (a.sis_ven - b.sis_ven) || a.producto.localeCompare(b.producto));
    const unSin = new Set(L.filter(f => f.vendido == null && f.total_sis > 0).map(f => f.unidad)).size;

      <div class="tarjeta kpi violeta c3"><p class="rot">Artículos con venta</p><p class="val">${f0(t.conVenta)}</p><p class="pie"><b>${f0(t.vendido)}</b> unidades vendidas · el reporte cubre <b>${f0(t.conDatos)}</b> artículos de la selección${unSin ? ` (${f0(unSin)} unidades de negocio no vienen en el reporte)` : ""}</p></div>
      <div class="tarjeta kpi verde c3"><p class="rot">Inventario cubre las ventas</p><p class="val">${f0(t.cubre)}</p><p class="pie">MobilVendor + Módulo B ≥ ventas · <b>${fp(t.cobertura)}</b> de los artículos con venta</p></div>
      <div class="tarjeta kpi ambar c3"><p class="rot">Ventas superan el inventario</p><p class="val">${f0(t.supera)}</p><p class="pie">Se vendió más de lo que hoy está cargado en los dos sistemas</p></div>
      <div class="tarjeta kpi rojo c3"><p class="rot">Vendido sin inventario</p><p class="val">${f0(t.sinInv)}</p><p class="pie">Con venta y en cero en MobilVendor y en Módulo B</p></div>

          <tbody>${X.map(f => `<tr><td class="cod">${esc(f.codigo)}</td><td class="prod"><b>${esc(descMV(f))}</b></td><td class="prod">${esc(descMB(f))}</td><td style="text-align:left;color:var(--gris)">${esc(f.medida)}</td>
            <td>${fq(f.inv_mv)}</td><td>${f.stock_mb == null ? "—" : fq(f.mb_conv)}${f.factor_mb !== 1 && f.stock_mb ? `<small class="mini">${fq(f.stock_mb)} × ${f.factor_mb}</small>` : ""}</td><td><b>${fq(f.total_sis)}</b></td><td style="color:var(--violeta);font-weight:800">${fq(f.vendido)}</td>
            <td class="${f.sis_ven < 0 ? "neg" : "pos"}">${f.sis_ven > 0 ? "+" : ""}${fq(f.sis_ven)}</td><td>${pillVen(f)}</td></tr>`).join("") || `<tr><td colspan="10" style="text-align:center;color:var(--gris)">Sin artículos con venta en la selección</td></tr>`}</tbody>

        <p class="notas" style="margin-top:10px">Ventas = unidades netas (facturas menos notas de crédito) del reporte publicado. Las ventas se revisan en la tarde y el inventario se carga en la mañana siguiente.</p></div>`;

  function vistaAud(L) {

      <div class="tarjeta kpi c3"><p class="rot">Exactitud del inventario</p><p class="val">${fp(T.exactitud)}</p>

      <div class="tarjeta c6" style="border-left:5px solid var(--rojo)"><h3>Artículos con mayor diferencia</h3><p class="sub">Auditada − (Módulo B + MobilVendor), ordenados por la diferencia en cantidad</p>

      <div class="tarjeta c6" style="border-left:5px solid var(--ambar)"><h3>Unidades de negocio con mayor diferencia</h3><p class="sub">Exactitud = contados que cuadran ÷ contados</p>
        ${uns.length ? `<ul class="equipo">${uns.map(u => `<li class="${u.exactitud != null && u.exactitud < 80 ? "bajo" : ""}"><span class="punto" style="background:${color(u.exactitud)}"></span>

      <div class="tarjeta c12"><h3>Auditoría por unidad de negocio</h3>

        <div class="tw alto-tabla" style="max-height:440px"><table>

            <td>${u.exactitud == null ? "—" : `<span class="pill ${sem(u.exactitud)}">${fp(u.exactitud)}</span>`}</td><td class="${u.difUni < 0 ? "neg" : u.difUni > 0 ? "pos" : ""}">${u.contados ? (u.difUni > 0 ? "+" : "") + fq(u.difUni) : "—"}</td></tr>`).join("")}</tbody>
          <tfoot><tr><td>Total</td><td>${f0(T.articulos)}</td><td>${f0(T.conStockMB)}</td><td>${f0(T.conStockMV)}</td><td>${f0(T.contados)}</td><td>${f0(T.cuadra)}</td><td>${f0(T.faltante)}</td><td>${f0(T.sobrante)}</td><td>${T.exactitud == null ? "—" : `<span class="pill ${sem(T.exactitud)}">${fp(T.exactitud)}</span>`}</td><td>${T.contados ? (T.difUni > 0 ? "+" : "") + fq(T.difUni) : "—"}</td></tr></tfoot>

  }

  /* ---------- pestaña 4: resumen escrito ---------- */
  function textos(L, sd) { return textosBase(L, sd).map(([t, p]) => [t, p.replace(/\.([\s\u00a0])m\.\./g, ".$1m.")]); }
  /* sd = sin dinero (informe en Word: sin costos ni valores en $) */
  function textosBase(L, sd) {
    const A = DS.archivos || {}, Fe = DS.fechas || {}, C = DS.conteo || {}, T = VJI.totalesConteo(L), U = VJI.porUnidadConteo(L, "valor");
    const MB = L.filter(f => f.stock_mb != null), MV = L.filter(f => f.inv_mv != null);
    const top3 = (X, k) => { const m = new Map(); X.forEach(f => m.set(f.unidad, (m.get(f.unidad) || 0) + (f[k] || 0))); return Array.from(m).sort((a, b) => b[1] - a[1]).slice(0, 3).map(([u, v]) => `${corto(u)} (${fk(v)})`).join(", "); };
    const top3n = (X, cond) => { const m = new Map(); X.filter(cond).forEach(f => m.set(f.unidad, (m.get(f.unidad) || 0) + 1)); return Array.from(m).sort((a, b) => b[1] - a[1]).slice(0, 3).map(([u, v]) => `${corto(u)} (${f0(v)} artículos)`).join(", "); };

    const difU = sd ? U.filter(u => u.faltante + u.sobrante).sort((a, b) => (b.faltante + b.sobrante) - (a.faltante + a.sobrante)).slice(0, 3).map(u => `${corto(u.unidad)} (${f0(u.faltante + u.sobrante)} artículos)`).join(", ")
      : U.filter(u => u.contados && Math.abs(u.difValor) >= 0.5).sort((a, b) => Math.abs(b.difValor) - Math.abs(a.difValor)).slice(0, 3).map(u => `${corto(u.unidad)} (${fus(u.difValor)})`).join(", ");
    const difA = L.filter(f => f.est2 === "Faltante" || f.est2 === "Sobrante").sort((a, b) => sd ? Math.abs(b.difc) - Math.abs(a.difc) : Math.abs(b.difc_valor) - Math.abs(a.difc_valor)).slice(0, 3).map(f => `${f.producto} (${f.est2.toLowerCase()} de ${fq(Math.abs(f.difc))} ${f.medida}${sd ? "" : ", " + fus(f.difc_valor)})`).join("; ");
    const prop = VJI.PROPIAS.map(p => { const X = L.filter(f => f.unidad === p), t = VJI.totalesConteo(X); return X.length ? `${corto(p)}: ${f0(X.reduce((a, f) => a + (f.inv_mv || 0), 0))} unidades en MobilVendor y ${f0(X.reduce((a, f) => a + (f.stock_mb || 0), 0))} en la presentación de Módulo B, que equivalen a ${f0(X.reduce((a, f) => a + (f.mb_conv || 0), 0))} unidades; ${f0(t.contados)} de ${f0(t.articulos)} artículos contados` : ""; }).filter(Boolean).join(". ");
    const dud = T.factorDudoso;
    return [
      ["Fuentes de la información", `La información de MobilVendor viene del exporte ${A.mv || "—"} de la bodega ${DS.bodega || "principal"}, con corte del ${DS.corte || "—"} y ${f0(C.mv)} artículos. La de Módulo B viene del archivo ${A.mb || "—"} (fecha del archivo ${Fe.mb || "—"}), con ${f0(C.mb)} artículos, de los cuales ${f0(C.mbConStock)} tienen stock. El conteo manual se registra en este dashboard${CARGA.actualizado ? ` y se publicó por última vez el ${CARGA.actualizado}${CARGA.por ? " por " + CARGA.por : ""}` : " y todavía no tiene conteos publicados"}. Este resumen cubre ${alcance}.`],
      ["Inventario del sistema", sd ? `El inventario del sistema es la suma de Módulo B y MobilVendor. Módulo B tiene ${f0(MB.filter(f => f.stock_mb > 0).length)} artículos con stock y MobilVendor ${f0(MV.filter(f => f.inv_mv > 0).length)} con existencia; en total son ${f0(L.length)} artículos. Las unidades de negocio con más artículos son ${top3n(L, f => f.total_sis > 0) || "—"}.` : `El inventario del sistema es la suma de MobilVendor y Módulo B. MobilVendor aporta ${fu(T.valorMV)} con ${f0(MV.filter(f => f.inv_mv > 0).length)} artículos con existencia y Módulo B ${fu(T.valorMB)} con ${f0(MB.filter(f => f.stock_mb > 0).length)} artículos con stock: en total ${fu(T.valorSis)}. Las unidades de negocio con más valor son ${top3(L, "valor_total") || "—"}.`],

        : T.contados
        ? `Se han contado ${f0(T.contados)} de ${f0(T.articulos)} artículos (${fp(T.avance)}). De ellos, ${f0(T.cuadra)} ${T.cuadra === 1 ? "coincide" : "coinciden"} con la suma de MobilVendor y Módulo B (exactitud de ${fp(T.exactitud)}), ${f0(T.faltante)} ${T.faltante === 1 ? "tiene" : "tienen"} faltante por ${fus(T.faltValor)} y ${f0(T.sobrante)} ${T.sobrante === 1 ? "tiene" : "tienen"} sobrante por ${fus(T.sobrValor)}. La diferencia neta es de ${fus(T.difValor)}${difU ? `, concentrada en ${difU}` : ""}.${difA ? ` Los artículos con mayor diferencia son ${difA}.` : ""}`

  /* ---------- pestaña 5: inventario manual ---------- */

  }

  /* ---------- cuadro: cantidades y detalles de MODULO B, MOBILVENDOR y lo auditado, uno al lado del otro ---------- */
  const detMB = f => f.stock_mb == null ? "—" : (f.mbCero ? "Stock en cero" : "Stock Módulo B") + (f.codigo_mb && f.codigo_mb !== f.codigo ? " · alterno " + f.codigo_mb : "") +
    (f.factor_mb !== 1 && f.stock_mb ? ` · ${fq(f.stock_mb)} × ${f.factor_mb} = ${fq(f.mb_conv)} ${f.medida}` : "") + (!f.factorOk && f.stock_mb > 0 ? " · factor por confirmar" : "") + (f.inv_mv == null ? " · no está en MobilVendor" : "");
  const detMV = f => f.inv_mv == null ? "—" : "Inventario MobilVendor" + (f.cajas_mv ? " · " + f1(f.cajas_mv) + " cajas" : "") + (f.stock_mb == null ? " · no está en Módulo B" : "");
  const detAud = f => { if (f.c == null) return "Sin contar"; const x = CARGA.filas[f.codigo]; return cambios().indexOf(f.codigo) > -1 ? "Conteo físico · sin guardar" : "Conteo físico" + (x && x.f ? " · " + x.f : "") + (x && x.p ? " · " + x.p : ""); };
  const celDif = f => f.c == null ? "—" : f.est2 === "Cuadra" ? '<span class="pill ok">cuadra</span>' : `<b class="${f.difc < 0 ? "t-mal" : "t-med"}">${f.difc > 0 ? "+" : ""}${fq(f.difc)}</b><small class="mini">${f.est2.toLowerCase()} · sistema ${fq(f.total_sis)}</small>`;
  const CANT = { mb: ["stock_mb", "Módulo B", f => fq(f.stock_mb)], mv: ["inv_mv", "MobilVendor", f => fq(f.inv_mv)], carga: ["c", "Auditada", f => f.c == null ? "—" : `<b>${fq(f.c)}</b>`], dif: ["difc", "Diferencia", celDif] };
  const DET = { mb: ["dmb", "Módulo B", detMB], mv: ["dmv", "MobilVendor", detMV], carga: ["dau", "Auditada", detAud] };
  const TIENE = { mb: f => f.stock_mb != null, mv: f => f.inv_mv != null, carga: f => f.c != null, dif: f => f.est2 === "Faltante" || f.est2 === "Sobrante", ven: f => f.vendido != null && (f.vendido || f.vend_ult) };
  const ORDEN_G = ["mb", "mv", "carga", "dif", "ven"];
  const presencia = f => (f.stock_mb != null ? '<span class="mod mb">Módulo B</span> ' : "") + (f.inv_mv != null ? '<span class="mod mv">MobilVendor</span>' : "");
  const textoFila = f => " " + nb([f.stock_mb != null ? "Modulo B" : "", f.inv_mv != null ? "MobilVendor" : "", f.c != null ? "auditada carga de inventario conteo" : "", f.est2, f.est_ven, f.codigo, f.codigo_mb, f.producto, f.producto_mb, f.unidad, f.medida, fq(f.stock_mb), fq(f.inv_mv), fq(f.total_sis), f.c == null ? "" : fq(f.c), fq(f.vendido), detMB(f), detMV(f), detAud(f)].join(" ")) + " ";
  function filasVisibles() {
    const Q = q(), G = ORDEN_G.filter(g => SLICE[g]);
    let R = Fsel().filter(f => G.some(g => TIENE[g](f)) && coincide(textoFila(f), Q));
    const k = ORD.k;
    const val = f => k === "modulo" ? (f.stock_mb != null ? 1 : 0) + (f.inv_mv != null ? 2 : 0) : ["codigo", "producto", "unidad", "medida"].indexOf(k) > -1 ? String(f[k] || "") :
      k === "dmb" ? detMB(f) : k === "dmv" ? detMV(f) : k === "dau" ? detAud(f) : (f[k] == null ? -Infinity : (k === "difc" ? Math.abs(f[k]) : f[k]));

      return db - da || a.unidad.localeCompare(b.unidad) || a.producto.localeCompare(b.producto);
    });
  }
  function pintarCuadro() {

    }));

      const n = v => v == null ? "" : String(Math.round(v * 100) / 100).replace(".", ",");

    const extN = "jpeg";
    const tieneLogo = logo.indexOf("base64,") > -1, emu = 762000;
    IMG_XML = tieneLogo ? `<w:r><w:drawing><wp:inline distT="0" distB="0" distL="0" distR="0"><wp:extent cx="${emu}" cy="${emu}"/><wp:docPr id="1" name="Logo Venejugos"/>
      <a:graphic><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:pic><pic:nvPicPr><pic:cNvPr id="1" name="logo.jpeg"/><pic:cNvPicPr/></pic:nvPicPr>
      <pic:blipFill><a:blip r:embed="rIdLogo"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill><pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="${emu}" cy="${emu}"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></pic:spPr></pic:pic></a:graphicData></a:graphic></wp:inline></w:drawing></w:r>` : "";
    const archivos = [
      { nombre: "[Content_Types].xml", data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Default Extension="jpeg" ContentType="image/jpeg"/><Default Extension="png" ContentType="image/png"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/word/footer1.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.footer+xml"/></Types>` },
      { nombre: "_rels/.rels", data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>` },
      { nombre: "word/_rels/document.xml.rels", data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rIdPie" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/footer" Target="footer1.xml"/>${tieneLogo ? '<Relationship Id="rIdLogo" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="media/logo.jpeg"/>' : ""}</Relationships>` },
      { nombre: "word/document.xml", data: documentoXml(d.html.replace(/src="logo"/g, 'src="logo"')) }
    ];
    if (tieneLogo) {
      const bin = atob(logo.split("base64,")[1]), u = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
      archivos.push({ nombre: "word/media/logo.jpeg", data: u });
    }
    const rp = '<w:rPr><w:rFonts w:ascii="Arial" w:hAnsi="Arial" w:cs="Arial"/><w:color w:val="6A7796"/><w:sz w:val="15"/></w:rPr>';
    archivos.push({ nombre: "word/footer1.xml", data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:ftr xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><w:p><w:pPr><w:jc w:val="center"/></w:pPr><w:r>${rp}<w:t xml:space="preserve">${xe(PIE_TEXTO)} · p. </w:t></w:r><w:r>${rp}<w:fldChar w:fldCharType="begin"/></w:r><w:r>${rp}<w:instrText xml:space="preserve"> PAGE </w:instrText></w:r><w:r>${rp}<w:fldChar w:fldCharType="separate"/></w:r><w:r>${rp}<w:t>1</w:t></w:r><w:r>${rp}<w:fldChar w:fldCharType="end"/></w:r></w:p></w:ftr>` });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(zip(archivos));
    a.download = (d.nombre || "Conciliacion_inventario") + ".docx";
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 3000);
  }
  /* ---------- pintar ---------- */
  function pintarVista() {
    const L = Fsel();
    $("vMb").innerHTML = vistaMB(L); $("vMv").innerHTML = vistaMV(L); $("vAud").innerHTML = vistaAud(L); $("vRes").innerHTML = vistaRes(L); $("vCarga").innerHTML = vistaCarga(L);
  }
  function pintar() {
    if (!DS) return;
    conteo();
    pintarAct(); pintarVista(); pintarCuadro(); pintarCarga();
    $("subtit").textContent = `Venejugos · bodega ${DS.bodega || "principal"} · sistema = Módulo B ${(DS.archivos || {}).mb || "—"} + MobilVendor ${(DS.archivos || {}).mv || "—"} (corte ${DS.corte || "—"}) frente al conteo manual`;
    $("pieArchivo").textContent = `Fuentes: Módulo B ${(DS.archivos || {}).mb || "—"} · MobilVendor ${(DS.archivos || {}).mv || "—"} · ventas ${VEN ? VEN.archivo + " (" + horaDe(VEN) + ")" : "sin publicar"} · carga manual ${CARGA.actualizado || "sin publicar"} · procesado el ${DS.generado}${DS.publicado ? " · publicado el " + DS.publicado : ""}`;
    guardarEstado();
  }

  /* ---------- slicer, pestañas y filtros ---------- */
  const PRESET = { mb: { mb: true, mv: true, dif: false, carga: true, ven: false }, mv: { mb: true, mv: true, dif: false, carga: true, ven: false }, aud: { mb: true, mv: true, dif: true, carga: true, ven: false } };
  document.querySelectorAll("#slicer .sl").forEach(b => b.addEventListener("click", () => { SLICE[b.dataset.m] = !SLICE[b.dataset.m]; pintarCuadro(); guardarEstado(); }));
  document.querySelectorAll(".pest").forEach(b => b.addEventListener("click", () => {
    document.querySelectorAll(".pest").forEach(x => x.classList.remove("activa")); b.classList.add("activa");
    VISTA = b.dataset.vista;
    const ID = { mb: "vMb", mv: "vMv", aud: "vAud", res: "vRes", carga: "vCarga" };
    Object.keys(ID).forEach(v => { $(ID[v]).style.display = v === VISTA ? "grid" : "none"; });
    if (PRESET[VISTA] && !b.dataset.sinPreset) Object.assign(SLICE, PRESET[VISTA]);
    delete b.dataset.sinPreset;
    $("carga").style.display = VISTA === "carga" ? "grid" : "none";
    pintarCuadro(); guardarEstado();
    if (VISTA === "carga") { const i = $("carga").querySelector("input.conteo"); if (i && window.innerWidth > 700) i.focus({ preventScroll: true }); }
  }));
  let tBus = null;
  $("fBuscar").addEventListener("input", () => { clearTimeout(tBus); tBus = setTimeout(() => { pintarCuadro(); pintarCarga(); }, 200); });
  $("bWord").addEventListener("click", descargarWord);

  const marcados = () => Array.from($("lUn").querySelectorAll("input:checked")).map(i => i.value);
  function etiquetaUn() { $("bUn").textContent = !SEL ? "Todas las unidades" : SEL.length === 1 ? corto(SEL[0]) : SEL.length + " unidades"; }
  function abrirUn(a) { $("pUn").hidden = !a; $("bUn").setAttribute("aria-expanded", a ? "true" : "false"); if (!a) { const l = marcados(); SEL = !l.length || l.length === UNS.length ? null : l; etiquetaUn(); pintar(); } }
  function listaUnidades() {
    UNS = Array.from(new Set(F.map(f => f.unidad))).sort((a, b) => (VJI.PROPIAS.indexOf(b) > -1) - (VJI.PROPIAS.indexOf(a) > -1) || a.localeCompare(b));
    if (SEL) { SEL = SEL.filter(u => UNS.indexOf(u) > -1); if (!SEL.length) SEL = null; }
    $("lUn").innerHTML = UNS.map(u => `<label class="multi-op"><input type="checkbox" value="${esc(u)}" ${!SEL || SEL.indexOf(u) > -1 ? "checked" : ""}>${esc(corto(u))}</label>`).join("");
    etiquetaUn();
  }
  $("bUn").addEventListener("click", e => { e.stopPropagation(); abrirUn($("pUn").hidden); });
  $("pUn").addEventListener("click", e => e.stopPropagation());
  $("bUnTodas").addEventListener("click", () => $("lUn").querySelectorAll("input").forEach(i => i.checked = true));
  $("bUnNinguna").addEventListener("click", () => $("lUn").querySelectorAll("input").forEach(i => i.checked = false));
  $("bSupListo").addEventListener("click", () => abrirUn(false));
  document.addEventListener("click", () => { if (!$("pUn").hidden) abrirUn(false); });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("pUn").hidden) abrirUn(false); });

  function leerEstado() { try { return JSON.parse(sessionStorage.getItem("vji_estado2") || "{}"); } catch (e) { return {}; } }
  function guardarEstado() { try { sessionStorage.setItem("vji_estado2", JSON.stringify({ sel: SEL, slice: SLICE, q: $("fBuscar").value, vista: VISTA })); } catch (e) {} }

  async function cargarCarga() {
    const r = await VJI.traerJSON("carga_manual.json", 1);
    if (r.json && r.json.filas) { CARGA = r.json; ORIGEN_CARGA = r.via; }
    else { const l = VJI.leerLocal("vji_carga"); if (l && l.filas) { CARGA = l; ORIGEN_CARGA = "copia de este navegador"; } else { CARGA = { filas: {} }; ORIGEN_CARGA = ""; } }
  }
  async function cargar(primera) {
    const r = await VJI.cargarDataset(INVENTARIO_BASE);
    DS = r.ds; F = VJI.filas(DS); ORIGEN = r.origen;
    const v = await VJI.traerJSON("ventas.json", 1);
    if (v.json && v.json.art) { VEN = v.json; ORIGEN_V = v.via; }
    else { const l = VJI.leerLocal("vji_ventas"); VEN = l && l.art ? l : (typeof VENTAS_BASE !== "undefined" ? VENTAS_BASE : null); ORIGEN_V = l && l.art ? "copia de este navegador" : "archivo base"; }
    VJI.aplicarVentas(F, VEN);
    const EST = primera ? leerEstado() : {};
    if (primera) { if (EST.sel) SEL = EST.sel; if (EST.q) $("fBuscar").value = EST.q; }
    listaUnidades();
    $("estado").innerHTML = `Origen: <b>${r.origen}</b>${r.error && !/^repositorio/.test(r.origen) ? " · no se pudo leer inventario.json (" + esc(r.error) + ")" : ""}`;
    pintar();
    if (primera) { const b = EST.vista && document.querySelector(`.pest[data-vista="${EST.vista}"]`); if (b) { b.dataset.sinPreset = "1"; b.click(); } if (EST.slice) { Object.assign(SLICE, EST.slice); pintarCuadro(); guardarEstado(); } }
    await cargarCarga();
    pintar();
  }
  $("bRecargar").addEventListener("click", async () => { $("bRecargar").disabled = true; $("bRecargar").textContent = "Recargando…"; await cargar(false); $("bRecargar").textContent = "Recargar datos"; $("bRecargar").disabled = false; });
  cargar(true);
})();

</script>
